<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">Ask AIDA — AIDA's AI assistant</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5efa"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d3a"/>
      <stop offset="1" stop-color="#181a4d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d2b8"/>
      <stop offset="1" stop-color="#e9b896"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ff"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- soft light rings -->
    <circle cx="160" cy="40" r="46" fill="#ffffff" opacity=".08"/>
    <circle cx="30" cy="170" r="54" fill="#ffffff" opacity=".07"/>
    <!-- hair (back) -->
    <path d="M44 110c-4-46 22-78 56-78s62 30 57 78c-2 22-6 40-12 52H56c-7-12-11-30-12-52z" fill="url(#hair)"/>
    <!-- neck -->
    <path d="M86 136h28v22H86z" fill="#e2ad8a"/>
    <!-- shoulders / blazer -->
    <path d="M30 210c4-34 30-54 70-54s66 20 70 54z" fill="url(#top)"/>
    <path d="M100 156l-16 4 16 26 16-26z" fill="#3a43ee"/>
    <path d="M58 168c10-7 22-11 30-12l12 30-30 24H40c2-18 8-32 18-42zM142 168c-10-7-22-11-30-12l-12 30 30 24h30c-2-18-8-32-18-42z" fill="#2f33d2"/>
    <circle cx="128" cy="182" r="4" fill="#22d3ee"/>
    <!-- face -->
    <ellipse cx="100" cy="102" rx="36" ry="42" fill="url(#skin)"/>
    <!-- ears -->
    <ellipse cx="64" cy="106" rx="6" ry="9" fill="#e9b896"/>
    <ellipse cx="136" cy="106" rx="6" ry="9" fill="#e9b896"/>
    <!-- hair (front fringe) -->
    <path d="M62 96c2-30 18-48 40-48 24 0 38 16 40 44-14-4-28-14-36-28-8 16-26 28-44 32z" fill="url(#hair)"/>
    <path d="M108 54c10 4 20 12 26 24" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8"/>
    <circle cx="134" cy="78" r="2.6" fill="#22d3ee"/>
    <!-- eyebrows -->
    <path d="M78 94q8-5 16 0M106 94q8-5 16 0" stroke="#2a1d3a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- eyes -->
    <ellipse cx="86" cy="105" rx="5" ry="6" fill="#1d1b33"/>
    <ellipse cx="114" cy="105" rx="5" ry="6" fill="#1d1b33"/>
    <circle cx="88" cy="103" r="1.7" fill="#fff"/>
    <circle cx="116" cy="103" r="1.7" fill="#fff"/>
    <path d="M80 99l-3-3M120 99l3-3" stroke="#1d1b33" stroke-width="1.8" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="78" cy="119" rx="6" ry="3.5" fill="#f19a9a" opacity=".45"/>
    <ellipse cx="122" cy="119" rx="6" ry="3.5" fill="#f19a9a" opacity=".45"/>
    <!-- nose & smile -->
    <path d="M100 108q-3 8 1 10" stroke="#c98f6d" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M88 126q12 10 24 0" stroke="#b5475a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- headset -->
    <path d="M60 104c0-30 18-52 40-52s40 22 40 52" stroke="#e8ecff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="53" y="96" width="13" height="22" rx="6" fill="#3a43ee"/>
    <rect x="134" y="96" width="13" height="22" rx="6" fill="#3a43ee"/>
    <circle cx="59.5" cy="107" r="3" fill="#22d3ee"/>
    <circle cx="140.5" cy="107" r="3" fill="#22d3ee"/>
    <path d="M60 117c2 14 12 20 26 20" stroke="#e8ecff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="84" y="133" width="10" height="7" rx="3.5" fill="#3a43ee"/>
  </g>
</svg>
